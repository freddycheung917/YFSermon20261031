<!doctype html>
<html lang="zh-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>講者視窗 · 唔使驚，上帝係大廳</title>
<style>
:root{--navy:#0E161D;--card:#16222B;--circle:#1F303B;--gold:#D4AA55;--text:#F3EFE7;--grey:#9AA8B2;--dim:#56687A;--teal:#5DB3AB;--red:#D0705E;
  --font-cjk:"Microsoft JhengHei","微軟正黑體","PingFang TC","Noto Sans TC","Noto Sans CJK TC","Source Han Sans TC",sans-serif;--font-num:Cambria,Georgia,"Caladea","Times New Roman","Microsoft JhengHei","微軟正黑體","PingFang TC","Noto Sans TC","Noto Sans CJK TC","Source Han Sans TC",sans-serif;--nsz:28px}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#0a1015;color:var(--text);font-family:var(--font-cjk)}
body{display:grid;grid-template-rows:64px 1fr;height:100vh;overflow:hidden}
header{display:flex;align-items:center;gap:28px;padding:0 24px;background:var(--navy);border-bottom:1px solid var(--circle)}
header .t{font-weight:700;color:var(--gold);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
.big{font-family:var(--font-num);font-size:30px;font-weight:700}
.timer{color:var(--gold)} .timer.over{color:var(--red)}
.lbl{font-size:13px;color:var(--grey);display:block;line-height:1}
button{background:var(--circle);color:var(--text);border:1px solid var(--dim);border-radius:8px;padding:8px 14px;font:inherit;font-size:15px;cursor:pointer}
button:hover{border-color:var(--gold)}
main{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:18px;padding:18px;min-height:0}
.col{display:flex;flex-direction:column;gap:12px;min-height:0}
.frame{position:relative;width:100%;aspect-ratio:16/9;background:var(--navy);border:1px solid var(--circle);border-radius:8px;overflow:hidden}
.frame iframe{position:absolute;inset:0;width:100%;height:100%;border:0;pointer-events:none}
.cap{font-size:14px;color:var(--grey)} .cap b{color:var(--gold);font-family:var(--font-num)}
.notes{flex:1;min-height:0;overflow:auto;background:var(--card);border-radius:8px;padding:20px 24px;font-size:var(--nsz);line-height:1.55;white-space:pre-wrap}
.notes .meta{color:var(--gold);font-size:.7em;margin-bottom:.6em}
.notes .nx{color:var(--grey);font-size:.7em;margin-top:.8em}
.warn{color:var(--red);font-size:16px}
.ctrl{display:flex;gap:8px;flex-wrap:wrap}
</style>
</head>
<body>
<header>
  <div class="t">唔使驚，上帝係大廳</div>
  <div><span class="lbl">頁數</span><span class="big" id="pos">– / –</span></div>
  <div><span class="lbl">時間提示</span><span class="big" id="cue" style="color:var(--teal)">–</span></div>
  <div><span class="lbl">已用時間</span><span class="big timer" id="timer">00:00</span></div>
  <div><span class="lbl">時鐘</span><span class="big" id="clock">--:--</span></div>
  <div class="ctrl">
    <button id="pause">⏯</button><button id="reset">↺</button>
    <button id="smaller">A−</button><button id="bigger">A+</button>
  </div>
</header>
<main>
  <div class="col">
    <div class="cap">現在</div>
    <div class="frame"><iframe id="fcur" src="index.html?preview" title="current" tabindex="-1"></iframe></div>
    <div class="ctrl"><button id="prev">◀ 上一步</button><button id="next">下一步 ▶</button><button id="blk">B 黑屏</button></div>
    <div class="cap" id="link"></div>
  </div>
  <div class="col">
    <div class="cap" id="nextcap">下一頁</div>
    <div class="frame"><iframe id="fnext" src="index.html?preview" title="next" tabindex="-1"></iframe></div>
    <div class="notes" id="notes"></div>
  </div>
</main>
<script src="notes.js" onerror="window.SERMON_NOTES=null"></script>
<script>
(function(){
  var NOTES = window.SERMON_NOTES, opener = window.opener, st = null;
  var $ = function(id){return document.getElementById(id)};
  var t0 = Date.now(), paused = 0, pauseAt = null;
  function send(m){ try{ if(opener && !opener.closed) opener.postMessage(m,"*"); else $("link").innerHTML='<span class="warn">未連接主視窗：請在投影頁按 N 開啟講者視窗。</span>'; }catch(e){} }
  function cmd(c,extra){ var m={type:"sermon-cmd",cmd:c}; for(var x in extra) m[x]=extra[x]; send(m); }
  function pv(f,i,k){ try{ f.contentWindow.postMessage({type:"sermon-preview",i:i,k:k},"*"); }catch(e){} }
  function render(){
    if(!st) return;
    $("pos").textContent = (st.i+1)+" / "+st.n + (st.steps[st.i] ? "  ·  "+st.k+"/"+st.steps[st.i] : "");
    pv($("fcur"), st.i, st.k);
    var more = st.k < st.steps[st.i];
    if (more) { pv($("fnext"), st.i, st.k+1); $("nextcap").textContent = "下一步（同一頁）"; }
    else if (st.i+1 < st.n) { pv($("fnext"), st.i+1, "max"); $("nextcap").textContent = "下一頁"; }
    else { pv($("fnext"), st.i, "max"); $("nextcap").textContent = "已是最後一頁"; }
    var n = NOTES && NOTES[st.i];
    var box = $("notes");
    if (!NOTES) { box.innerHTML = '<span class="warn">公開版：沒有講稿（用 build_web.py 不加 --public 重新生成，才會有 notes.js）。</span>'; $("cue").textContent="–"; return; }
    box.innerHTML = "";
    var meta = document.createElement("div"); meta.className="meta"; meta.textContent = n && n.pos || ""; box.appendChild(meta);
    var body = document.createElement("div"); body.textContent = n && n.notes || ""; box.appendChild(body);
    if (n && n.next){ var nx=document.createElement("div"); nx.className="nx"; nx.textContent=n.next; box.appendChild(nx); }
    $("cue").textContent = n && n.time || "–";
    box.scrollTop = 0;
  }
  window.addEventListener("message", function(e){ var m=e.data||{}; if(m.type==="sermon-state"){ st=m; render(); } });
  function pad(x){return (x<10?"0":"")+x}
  setInterval(function(){
    var ms = (pauseAt||Date.now()) - t0 - paused, s = Math.floor(ms/1000);
    $("timer").textContent = pad(Math.floor(s/60))+":"+pad(s%60);
    var d = new Date(); $("clock").textContent = pad(d.getHours())+":"+pad(d.getMinutes());
    var n = NOTES && st && NOTES[st.i];
    if (n && n.time) { var p=n.time.split(":"); var cue=(+p[0])*60+(+p[1]||0); $("timer").classList.toggle("over", s > cue + 120); }
  }, 250);
  $("pause").onclick=function(){ if(pauseAt){ paused += Date.now()-pauseAt; pauseAt=null; } else pauseAt=Date.now(); };
  $("reset").onclick=function(){ t0=Date.now(); paused=0; pauseAt=pauseAt?Date.now():null; };
  var nsz=28; $("bigger").onclick=function(){nsz+=3;document.documentElement.style.setProperty("--nsz",nsz+"px")};
  $("smaller").onclick=function(){nsz=Math.max(14,nsz-3);document.documentElement.style.setProperty("--nsz",nsz+"px")};
  $("prev").onclick=function(){cmd("prev")}; $("next").onclick=function(){cmd("next")}; $("blk").onclick=function(){cmd("black")};
  document.addEventListener("keydown", function(e){
    if (e.ctrlKey||e.metaKey||e.altKey) return;
    switch(e.key){
      case "ArrowRight": case "ArrowDown": case "PageDown": case " ": case "Enter": cmd(e.shiftKey&&e.key===" "?"prev":"next"); break;
      case "ArrowLeft": case "ArrowUp": case "PageUp": case "Backspace": cmd("prev"); break;
      case "b": case "B": case ".": cmd("black"); break;
      case "Home": cmd("go",{i:0,k:0}); break;
      default: return;
    }
    e.preventDefault();
  });
  var hello=function(){ send({type:"sermon-hello"}); };
  $("fcur").addEventListener("load", hello); $("fnext").addEventListener("load", function(){ if(st) render(); });
  hello();
  if (!opener) $("link").innerHTML='<span class="warn">未連接主視窗：請在投影頁按 N 開啟講者視窗。</span>';
})();
</script>
</body>
</html>
